# kiali/kiali-operator values for OCI single-node k3s.
# Kiali is public for the portfolio, but the UI must stay view-only.

cr:
  create: true
  namespace: istio-system
  spec:
    auth:
      strategy: anonymous
    deployment:
      view_only_mode: true
      ingress:
        enabled: true
        override_yaml:
          metadata:
            annotations:
              nginx.ingress.kubernetes.io/app-root: "/kiali"
          spec:
            ingressClassName: nginx
            rules:
              - host: kiali.fileinnout.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: kiali
                          port:
                            number: 20001
      accessible_namespaces:
        - "**"
      resources:
        requests:
          cpu: "100m"
          memory: "256Mi"
        limits:
          cpu: "300m"
          memory: "512Mi"
    external_services:
      grafana:
        enabled: true
        internal_url: "http://grafana.observability.svc.cluster.local"
        external_url: "https://grafana.fileinnout.com"
      prometheus:
        url: "http://prometheus-server.observability.svc.cluster.local"
      tracing:
        enabled: true
        in_cluster_url: "http://jaeger-query.observability.svc.cluster.local:16686"
        url: "https://jaeger.fileinnout.com"
        use_grpc: false
      istio:
        root_namespace: istio-system
